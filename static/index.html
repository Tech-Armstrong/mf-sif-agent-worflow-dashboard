<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Upload Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1c2330; --muted: #6b7482; --line: #e2e5ea;
    --accent: #1f5fd6; --accent-ink: #fff; --user: #e8f0fe; --warn-bg: #fff7e6; --warn-line: #f0c36d;
    --ok: #1a7f37; --bad: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #98a1b0; --line: #2c333f;
      --accent: #5b8def; --accent-ink: #0b1020; --user: #1f2b44; --warn-bg: #2a2416; --warn-line: #7a5c1e;
      --ok: #4cc06b; --bad: #ef6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; }
  header small { color: var(--muted); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; height: calc(100vh - 58px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #chat { min-height: 70vh; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #drop { margin: 14px; border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  #drop.over { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop b { color: var(--ink); }
  #files { list-style: none; margin: 0; padding: 0 14px 14px; overflow: auto; flex: 1; }
  #files li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  #files .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files .size { color: var(--muted); font-size: 12px; }
  .x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .x:hover { color: var(--bad); }
  .quick { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .quick button { text-align: left; }
  #chat .log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 13px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.agent { align-self: flex-start; border: 1px solid var(--line); }
  .msg.sys { align-self: center; color: var(--muted); font-size: 13px; }
  .msg.err { align-self: center; color: var(--bad); font-size: 13px; }
  .approval { align-self: stretch; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 12px 14px; }
  .approval pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-size: 12px; overflow: auto; max-height: 220px; margin: 6px 0; }
  .approval .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .approval input { flex: 1; min-width: 160px; }
  form.compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input[type=text], textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  textarea { flex: 1; resize: none; height: 44px; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  button:disabled { opacity: .5; cursor: default; }
  #left { overflow: auto; }
  .settings { padding: 12px 14px 4px; display: grid; gap: 10px; }
  .settings label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  select, .ms-btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 8px 6px; font-size: 13px; background: var(--bg); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .ms { position: relative; }
  .ms-btn { text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .ms-btn::after { content: "▾"; color: var(--muted); }
  .ms-pop { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); display: none; }
  .ms.open .ms-pop { display: block; }
  .ms-pop input[type=search] { width: calc(100% - 16px); margin: 8px; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .ms-acts { display: flex; gap: 6px; padding: 0 8px 6px; }
  .ms-acts button { padding: 3px 10px; font-size: 12px; }
  .ms-list { max-height: 260px; overflow: auto; padding: 0 4px 6px; }
  .ms-list label { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .ms-list label:hover { background: var(--bg); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--user); border-radius: 999px; padding: 2px 4px 2px 9px; font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
  .chip button { border: 0; background: none; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
  .kv dd.warn { color: var(--bad); }
  :root { --good: #0ca30c; --critical: #d03b3b; --na: #b9b8b0; --grid: #e1e0d9; }
  @media (prefers-color-scheme: dark) { :root { --na: #4a4a46; --grid: #2c2c2a; } }
  [hidden] { display: none !important; }
  .side-head { display: flex; justify-content: space-between; align-items: center; }
  .side-btn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 0 8px; height: 26px; font-size: 15px; line-height: 1; border-radius: 6px; }
  .side-btn:hover { color: var(--ink); border-color: var(--muted); }
  .rail { display: none; }
  #view-upload.collapsed { grid-template-columns: 46px 1fr; }
  #view-upload.collapsed #left > :not(.rail) { display: none; }
  #view-upload.collapsed .rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0; height: 100%; cursor: pointer; }
  .rail-txt { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  @media (max-width: 800px) {
    #view-upload.collapsed { grid-template-columns: 1fr; }
    #view-upload.collapsed .rail { flex-direction: row; padding: 8px 10px; height: auto; }
    .rail-txt { writing-mode: horizontal-tb; transform: none; }
  }
  .tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; padding: 5px 14px; font-size: 14px; background: none; border-radius: 6px; }
  .tabs button.on { background: var(--panel); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 600; }
  main.cov { display: block; height: auto; }
  .cov-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .cov-bar .seg { min-width: 300px; }
  .cov-bar .seg.fund { min-width: 120px; }
  .cov-bar select { width: auto; }
  .tog { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); margin-left: auto; }
  #cov-body { padding: 14px; }
  .banner { padding: 10px 12px; border-radius: 8px; background: var(--warn-bg); border: 1px solid var(--warn-line); margin-bottom: 12px; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 10px; align-items: center; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .mk { width: 22px; height: 22px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; line-height: 1; }
  .mk.up { background: var(--good); color: #fff; }
  .mk.miss { background: var(--critical); color: #fff; }
  .mk.na { color: var(--na); font-weight: 400; }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.cov-t { border-collapse: collapse; width: 100%; font-size: 13px; }
  .cov-t th, .cov-t td { padding: 5px 6px; border-bottom: 1px solid var(--grid); text-align: center; }
  .cov-t thead th { font-weight: 600; color: var(--muted); font-size: 12px; vertical-align: bottom; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
  .cov-t th.amc, .cov-t td.amc { text-align: left; white-space: nowrap; padding-left: 12px; }
  .cov-t td.amc small { display: block; color: var(--critical); font-size: 11px; }
  .cov-t tr:last-child td { border-bottom: 0; }
  .cov-t tbody tr:hover { background: var(--bg); }
  .cov-t td.done { text-align: right; padding-right: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { display: inline-block; vertical-align: middle; width: 56px; height: 6px; border-radius: 3px; background: var(--grid); margin-left: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
  .fs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .fs { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .fs .t { min-width: 0; } .fs .t b { font-weight: 500; display: block; }
  .fs .t small { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 320px; display: none; white-space: pre-line; }
  .dots::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:18px">
    <h1>Drive Upload Agent</h1>
    <nav class="tabs"><button class="on" data-view="upload">Upload</button><button data-view="coverage">Coverage</button></nav>
  </div>
  <small id="who"></small>
</header>
<main id="view-coverage" class="cov" hidden>
  <section class="panel">
    <div class="cov-bar">
      <div class="seg fund" id="cov-funds"></div>
      <div class="seg" id="cov-types"></div>
      <select id="cov-year" aria-label="Year"></select>
      <select id="cov-month" aria-label="Month"></select>
      <label class="tog"><input type="checkbox" id="cov-gaps"> Only <span id="cov-gaps-l">AMCs</span> with gaps</label>
      <button type="button" id="cov-refresh" title="Re-read Drive (ignores the 5-minute cache)">Refresh</button>
    </div>
    <div id="cov-body"></div>
  </section>
  <div id="tip" role="tooltip"></div>
</main>
<main id="view-upload">
  <section class="panel" id="left">
    <div class="rail">
      <button type="button" class="side-btn" id="expand" title="Show sidebar" aria-label="Show sidebar" aria-expanded="false">»</button>
      <span class="rail-txt" id="rail-txt"></span>
    </div>
    <h2 class="side-head">Drive destination
      <button type="button" class="side-btn" id="collapse" title="Hide sidebar" aria-label="Hide sidebar" aria-expanded="true">«</button>
    </h2>
    <div class="settings">
      <label class="f">Fund
        <div class="seg" id="funds"></div>
      </label>
      <label class="f">Type
        <div class="seg" id="types"></div>
      </label>
      <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em"><span id="amc-label">AMC</span>
        <div class="ms" id="amc">
          <button type="button" class="ms-btn" id="amc-btn">Select AMCs</button>
          <div class="ms-pop">
            <input type="search" id="amc-q" placeholder="Search…">
            <div class="ms-acts"><button type="button" id="amc-all">Select all</button><button type="button" id="amc-none">Clear</button></div>
            <div class="ms-list" id="amc-list"></div>
          </div>
        </div>
      </div>
      <div class="chips" id="amc-chips"></div>
      <div class="row2">
        <label class="f">Year <select id="year"></select></label>
        <label class="f">Month <select id="month"></select></label>
      </div>
      <p class="hint" id="dest-hint"></p>
    </div>
    <h2>Your files</h2>
    <label id="drop"><b>Drop files here</b><br>or click to choose<br><small>PDF, Excel, Word, CSV, text · max 100 MB each</small>
      <input id="picker" type="file" multiple hidden>
    </label>
    <ul id="files"></ul>
    <div class="quick">
      <button data-q="Upload my files to Google Drive using the selected type, AMCs/SIFs, year and month.">Upload to Drive</button>
    </div>
  </section>
  <section class="panel" id="chat">
    <h2>Chat</h2>
    <div class="log" id="log"><div class="msg sys">Upload files on the left, then ask the agent to read them or save them to Google Drive. Drive uploads wait for your approval.</div></div>
    <form class="compose" id="compose">
      <textarea id="text" placeholder="e.g. Check the files, then upload them to Drive"></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let thread = null, busy = false;
try { thread = sessionStorage.getItem("thread"); } catch {}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `${r.status} ${r.statusText}`);
  return body;
}
function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  $("#log").appendChild(d); d.scrollIntoView({ block: "end" });
  return d;
}
function setBusy(b) {
  busy = b;
  document.querySelectorAll("#send, .quick button").forEach(x => x.disabled = b);
}
const kb = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";

function renderFiles(files) {
  const ul = $("#files"); ul.innerHTML = "";
  if (!files.length) { ul.innerHTML = '<li style="justify-content:center;color:var(--muted)">No files yet</li>'; return; }
  for (const f of files) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="name"></span><span class="size">${kb(f.size_bytes)}</span><button class="x" title="Remove">×</button>`;
    li.querySelector(".name").textContent = f.name; li.querySelector(".name").title = f.name;
    li.querySelector(".x").onclick = async () => {
      const r = await api(`/api/files?thread_id=${thread}&file_id=${encodeURIComponent(f.file_id)}`, { method: "DELETE" });
      renderFiles(r.files);
    };
    ul.appendChild(li);
  }
}

async function uploadFiles(list) {
  if (!list.length) return;
  const fd = new FormData(); fd.append("thread_id", thread);
  for (const f of list) fd.append("files", f);
  const note = add("sys dots", `Uploading ${list.length} file(s)`);
  try {
    const r = await api("/api/upload", { method: "POST", body: fd });
    note.classList.remove("dots");
    note.textContent = r.saved.length ? `Added: ${r.saved.map(f => f.name).join(", ")}` : "No files added";
    r.errors.forEach(e => add("err", e));
    renderFiles(r.files);
  } catch (e) { note.remove(); add("err", "Upload failed: " + e.message); }
}

function handle(r) {
  if (r.status === "approval") return showApproval(r.actions);
  add("agent", r.reply || "(no reply)");
  setBusy(false);
}

function showApproval(actions) {
  const box = document.createElement("div"); box.className = "approval";
  box.innerHTML = "<b>Approval needed</b> — the agent wants to:";
  for (const a of actions) {
    const t = document.createElement("div"); t.style.marginTop = "6px";
    t.innerHTML = "<code></code>"; t.firstChild.textContent = a.tool;
    if (a.tool === "Upload to Drive") {
      const dl = document.createElement("dl"); dl.className = "kv";
      for (const [k, v] of Object.entries(a.arguments)) {
        const dt = document.createElement("dt"), dd = document.createElement("dd");
        dt.textContent = k; dd.textContent = v; if (k === "warning") dd.className = "warn";
        dl.append(dt, dd);
      }
      box.append(dl); continue;
    }
    const pre = document.createElement("pre"); pre.textContent = JSON.stringify(a.arguments, null, 2);
    box.append(t, pre);
  }
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = '<button class="ok">Approve</button><input type="text" placeholder="Or say what to change…"><button>Decline</button>';
  box.appendChild(row); $("#log").appendChild(box); box.scrollIntoView({ block: "end" });
  const [yes, fb, no] = row.children;
  const decide = async approve => {
    row.querySelectorAll("button,input").forEach(x => x.disabled = true);
    box.insertAdjacentHTML("beforeend", `<div style="margin-top:6px;color:var(--muted)">${approve ? "Approved" : "Declined"}</div>`);
    const wait = add("sys dots", approve ? "Running" : "Telling the agent");
    try { const r = await api("/api/approve", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ thread_id: thread, approve, feedback: fb.value }) });
          wait.remove(); handle(r); }
    catch (e) { wait.remove(); add("err", e.message); setBusy(false); }
  };
  yes.onclick = () => decide(true); no.onclick = () => decide(false);
}

async function send(text) {
  text = text.trim(); if (!text || busy) return;
  setBusy(true); add("user", text); $("#text").value = "";
  const wait = add("sys dots", "Thinking");
  try { const r = await api("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ thread_id: thread, message: text, settings: currentSettings() }) });
        wait.remove(); handle(r); }
  catch (e) { wait.remove(); add("err", "Error: " + e.message); setBusy(false); }
}

$("#compose").onsubmit = e => { e.preventDefault(); send($("#text").value); };
$("#text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#text").value); } };
document.querySelectorAll(".quick button").forEach(b => b.onclick = () => send(b.dataset.q));
$("#picker").onchange = e => { uploadFiles([...e.target.files]); e.target.value = ""; };
const drop = $("#drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => uploadFiles([...e.dataTransfer.files]));

// ---------- destination settings ----------
const sel = { doc_type: "", amcs: new Set() };
let OPTS = null;
const save = () => { try { localStorage.setItem("dest", JSON.stringify({ doc_type: sel.doc_type, amcs: [...sel.amcs] })); } catch {} };
// Types are a Fund (MF / SIF) x Kind (Portfolio / Factsheet) grid; each AMC/SIF list belongs to its fund.
const KIND_LABEL = { Portfolio: "Monthly Portfolio", Factsheet: "Factsheet" };
const TI = t => OPTS.types[t];
const typeOf = (fund, kind) => OPTS.doc_types.find(t => TI(t).fund === fund && TI(t).kind === kind);
const pool = () => TI(sel.doc_type).managers;           // AMCs or SIFs for the current type
const picked = () => pool().filter(a => sel.amcs.has(a)); // selections kept per fund, shown for the current one
const mlabel = () => TI(sel.doc_type).manager_label;     // "AMC" or "SIF"
const shortName = a => a.replace(/ Mutual Fund$/, "");
function segButtons(el, items, current, label, onPick) {
  el.innerHTML = "";
  for (const v of items) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = label(v);
    b.className = v === current ? "on" : ""; b.onclick = () => onPick(v);
    el.appendChild(b);
  }
}
const FUNDS = () => [...new Set(OPTS.doc_types.map(t => TI(t).fund))];
const KINDS = () => [...new Set(OPTS.doc_types.map(t => TI(t).kind))];
function currentSettings() {
  return { doc_type: sel.doc_type, amcs: picked(), year: +$("#year").value, month: $("#month").value };
}
function renderTypes() {
  const cur = TI(sel.doc_type);
  const pick = t => { if (!t) return; sel.doc_type = t; save(); $("#amc-q").value = ""; renderTypes(); renderAmcs(); renderSelected(); };
  segButtons($("#funds"), FUNDS(), cur.fund, f => f, f => pick(typeOf(f, cur.kind)));
  segButtons($("#types"), KINDS(), cur.kind, k => KIND_LABEL[k] || k, k => pick(typeOf(cur.fund, k)));
  $("#amc-label").textContent = mlabel();
  $("#amc-q").placeholder = `Search ${mlabel()}…`;
}
function renderAmcs() {
  const q = $("#amc-q").value.toLowerCase();
  $("#amc-list").innerHTML = "";
  for (const a of pool().filter(a => a.toLowerCase().includes(q))) {
    const l = document.createElement("label");
    l.innerHTML = '<input type="checkbox"><span></span>';
    l.lastChild.textContent = a; l.firstChild.checked = sel.amcs.has(a);
    l.firstChild.onchange = e => { e.target.checked ? sel.amcs.add(a) : sel.amcs.delete(a); save(); renderSelected(); };
    $("#amc-list").appendChild(l);
  }
}
function renderSelected() {
  const p = picked(), L = mlabel();
  $("#amc-btn").textContent = p.length === 0 ? `Select ${L}s` : p.length === 1 ? p[0] : `${p.length} ${L}s selected`;
  $("#amc-chips").innerHTML = "";
  for (const a of p) {
    const c = document.createElement("span"); c.className = "chip";
    c.innerHTML = '<span></span><button type="button" title="Remove">×</button>';
    c.firstChild.textContent = shortName(a);
    c.lastChild.onclick = () => { sel.amcs.delete(a); save(); renderSelected(); renderAmcs(); };
    $("#amc-chips").appendChild(c);
  }
  renderHint();
}
function setCollapsed(c) {
  $("#view-upload").classList.toggle("collapsed", c);
  $("#collapse").setAttribute("aria-expanded", String(!c)); $("#expand").setAttribute("aria-expanded", String(!c));
  try { localStorage.setItem("sideCollapsed", c ? "1" : ""); } catch {}
}
function renderRail() {
  const p = picked(), L = mlabel();
  const amc = p.length === 0 ? `no ${L} selected` : p.length === 1 ? shortName(p[0]) : `${p.length} ${L}s`;
  $("#rail-txt").textContent = `${sel.doc_type} · ${amc} · ${$("#month").value} ${$("#year").value}`;
}
function renderHint() {
  renderRail();
  const y = $("#year").value, m = $("#month").value, t = TI(sel.doc_type), L = t.manager_label;
  const fname = (t.file_name || "").replace("{name}", `<${L}>`).replace("{short}", `<${L}>`);
  $("#dest-hint").textContent = t.layout === "amc_file"
    ? `Saved as “${fname}.pdf” in ${t.root}/${y}/${m}/ (one file per ${L}).`
    : `Each file goes into its own ${L}'s folder in ${t.root}/${y}/${m}/ (matched by file name or contents).`;
}
async function initSettings() {
  OPTS = await api("/api/options");
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("dest") || "{}"); } catch {}
  sel.doc_type = OPTS.doc_types.includes(saved.doc_type) ? saved.doc_type : OPTS.default.doc_type;
  const known = new Set(OPTS.doc_types.flatMap(t => TI(t).managers));
  (saved.amcs || []).filter(a => known.has(a)).forEach(a => sel.amcs.add(a));
  $("#year").innerHTML = OPTS.years.map(y => `<option>${y}</option>`).join("");
  $("#month").innerHTML = OPTS.months.map(m => `<option>${m}</option>`).join("");
  $("#year").value = OPTS.default.year; $("#month").value = OPTS.default.month;
  $("#year").onchange = $("#month").onchange = renderHint;
  renderTypes(); renderAmcs(); renderSelected();
  $("#amc-btn").onclick = () => { $("#amc").classList.toggle("open"); $("#amc-q").focus(); };
  $("#amc-q").oninput = renderAmcs;
  $("#amc-all").onclick = () => { pool().forEach(a => sel.amcs.add(a)); save(); renderAmcs(); renderSelected(); };
  $("#amc-none").onclick = () => { pool().forEach(a => sel.amcs.delete(a)); save(); renderAmcs(); renderSelected(); };
  document.addEventListener("click", e => { if (!$("#amc").contains(e.target)) $("#amc").classList.remove("open"); });
  $("#collapse").onclick = () => setCollapsed(true);
  document.querySelector(".rail").onclick = () => { setCollapsed(false); $("#collapse").focus(); };
  let c = false; try { c = localStorage.getItem("sideCollapsed") === "1"; } catch {}
  setCollapsed(c);
}

// ---------- coverage view ----------
const cov = { doc_type: "Monthly Portfolio Disclosure", loaded: "", data: null, seq: 0 };
const SHORT = { "Large Cap": "Large", "Mid Cap": "Mid", "Small Cap": "Small", "Flexi Cap": "Flexi", "Focused": "Focused",
  "Value / Contra": "Value / Contra", "Balanced Advantage": "Bal. Adv.", "Multi Asset": "Multi Asset",
  "Business Cycle": "Bus. Cycle", "Conservative Hybrid": "Cons. Hybrid",
  "Equity Long-Short": "Equity L/S", "Equity Ex-Top 100": "Ex-Top 100", "Hybrid Long-Short": "Hybrid L/S",
  "Active Asset Allocator": "Asset Alloc.", "Sector Rotation": "Sector Rot.", "Debt Long-Short": "Debt L/S" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MK = { uploaded: '<span class="mk up" aria-label="Uploaded">✓</span>', missing: '<span class="mk miss" aria-label="Missing">✕</span>',
  na: '<span class="mk na" aria-label="Not offered">–</span>' };

function showView(v) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#view-upload").hidden = v !== "upload"; $("#view-coverage").hidden = v !== "coverage";
  try { localStorage.setItem("view", v); } catch {}
  if (v === "coverage") loadCoverage(false);
}
function initCoverage() {
  try { cov.doc_type = localStorage.getItem("covType") || cov.doc_type; } catch {}
  if (!OPTS.doc_types.includes(cov.doc_type)) cov.doc_type = OPTS.default.doc_type;
  $("#cov-year").innerHTML = OPTS.years.map(y => `<option>${y}</option>`).join("");
  $("#cov-month").innerHTML = OPTS.months.map(m => `<option>${m}</option>`).join("");
  $("#cov-year").value = OPTS.default.year; $("#cov-month").value = OPTS.default.month;
  const types = () => {
    const cur = TI(cov.doc_type);
    const pick = t => { if (!t) return; cov.doc_type = t; try { localStorage.setItem("covType", t); } catch {} types(); loadCoverage(false); };
    segButtons($("#cov-funds"), FUNDS(), cur.fund, f => f, f => pick(typeOf(f, cur.kind)));
    segButtons($("#cov-types"), KINDS(), cur.kind, k => KIND_LABEL[k] || k, k => pick(typeOf(cur.fund, k)));
    $("#cov-gaps-l").textContent = cur.manager_label + "s";
  };
  types();
  $("#cov-year").onchange = $("#cov-month").onchange = () => loadCoverage(false);
  $("#cov-gaps").onchange = () => cov.data && renderCoverage(cov.data);
  $("#cov-refresh").onclick = () => loadCoverage(true);
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showView(b.dataset.view));
  const tip = $("#tip");
  $("#cov-body").addEventListener("mousemove", e => {
    const t = e.target.closest("[data-tip]");
    if (!t) { tip.style.display = "none"; return; }
    tip.textContent = t.dataset.tip; tip.style.display = "block";
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
  });
  $("#cov-body").addEventListener("mouseleave", () => tip.style.display = "none");
}
async function loadCoverage(refresh) {
  const key = `${cov.doc_type}|${$("#cov-year").value}|${$("#cov-month").value}`;
  if (!refresh && key === cov.loaded && cov.data) return renderCoverage(cov.data);
  const seq = ++cov.seq;
  $("#cov-body").innerHTML = `<p class="dots" style="color:var(--muted)">Reading Google Drive (the first load of a month takes about 20 seconds)</p>`;
  try {
    const q = new URLSearchParams({ doc_type: cov.doc_type, year: $("#cov-year").value, month: $("#cov-month").value, refresh });
    const d = await api("/api/coverage?" + q);
    if (seq !== cov.seq) return;  // a newer request replaced this one
    cov.data = d; cov.loaded = key; renderCoverage(d);
  } catch (e) {
    if (seq === cov.seq) $("#cov-body").innerHTML = `<div class="banner">Could not load coverage: ${esc(e.message)}</div>`;
  }
}
function renderCoverage(d) {
  const gapsOnly = $("#cov-gaps").checked;
  let h = "";
  if (!d.month_exists) h += `<div class="banner">There is no <b>${esc(d.path)}</b> folder in Drive yet, so everything for this month shows as missing.</div>`;
  const L = d.manager_label || "AMC";
  if (d.layout === "amc_file") {
    const up = d.rows.filter(r => r.status === "uploaded").length;
    h += `<div class="tiles"><div class="tile"><div class="k">Factsheets uploaded</div><div class="v">${up} <small>of ${d.rows.length} ${L}s</small></div></div>
          <div class="tile"><div class="k">Missing</div><div class="v">${d.rows.length - up}</div></div></div>`;
    h += `<div class="legend"><span>${MK.uploaded} Uploaded</span><span>${MK.missing} Missing</span><span>${esc(d.path)}</span></div><div class="fs-grid">`;
    for (const r of d.rows.filter(r => !gapsOnly || r.status === "missing")) {
      h += `<div class="fs" data-tip="${esc(r.status === "uploaded" ? r.files.join("\n") : `No factsheet for this ${L}`)}">${MK[r.status]}
            <div class="t"><b>${esc(r.amc)}</b><small>${r.status === "uploaded" ? esc(r.files.join(", ")) : "Missing"}</small></div></div>`;
    }
    h += `</div>`;
  } else {
    const exp = d.rows.reduce((s, r) => s + r.expected, 0), up = d.rows.reduce((s, r) => s + r.uploaded, 0);
    const complete = d.rows.filter(r => r.expected > 0 && r.uploaded >= r.expected).length;
    const gaps = d.rows.filter(r => r.uploaded < r.expected);
    h += `<div class="tiles">
      <div class="tile"><div class="k">Funds uploaded</div><div class="v">${up} <small>of ${exp} expected</small></div></div>
      <div class="tile"><div class="k">${L}s complete</div><div class="v">${complete} <small>of ${d.rows.length}</small></div></div>
      <div class="tile"><div class="k">Funds missing</div><div class="v">${exp - up} <small>across ${gaps.length} ${L}${gaps.length === 1 ? "" : "s"}</small></div></div></div>`;
    h += `<div class="legend"><span>${MK.uploaded} Uploaded</span><span>${MK.missing} Missing (the ${L} had it in ${esc(d.lookback.join(", "))})</span>
          <span>${MK.na} Not offered by this ${L}</span></div>`;
    h += `<div class="tbl-wrap"><table class="cov-t"><thead><tr><th class="amc">${L}</th>${d.categories.map(c => `<th title="${esc(c)}">${esc(SHORT[c] || c)}</th>`).join("")}<th class="done">Done</th></tr></thead><tbody>`;
    const rows = gapsOnly ? gaps : d.rows;
    if (!rows.length) h += `<tr><td colspan="${d.categories.length + 2}" style="padding:16px;color:var(--muted)">No gaps: every ${L} has all its expected funds.</td></tr>`;
    for (const r of rows) {
      const pct = r.expected ? Math.round(100 * r.uploaded / r.expected) : 0;
      h += `<tr><td class="amc">${esc(r.amc)}${r.folder_missing ? `<small>${L} folder missing in Drive</small>` : ""}</td>`;
      for (const c of d.categories) {
        const cell = r.cells[c];
        const tip = `${r.amc} · ${c}\n` + (cell.status === "uploaded" ? cell.files.join("\n") : cell.status === "missing" ? "Missing this month" : "Not offered (none in the last 3 months)");
        h += `<td data-tip="${esc(tip)}">${MK[cell.status]}</td>`;
      }
      h += `<td class="done">${r.uploaded}/${r.expected}<span class="bar"><i style="width:${pct}%"></i></span></td></tr>`;
    }
    h += `</tbody></table></div>`;
    const other = d.rows.filter(r => r.other.length);
    if (other.length) h += `<p class="note">Files not matched to a category: ${other.map(r => `${esc(r.amc)}: ${esc(r.other.join(", "))}`).join("; ")}</p>`;
  }
  $("#cov-body").innerHTML = h;
}

(async () => {
  await initSettings();
  initCoverage();
  let v = "upload"; try { v = localStorage.getItem("view") || v; } catch {}
  showView(v);
  // Agent memory is in-process, so a server restart starts a fresh chat.
  const s = await api("/api/session", { method: "POST" });
  if (!thread) { thread = s.thread_id; try { sessionStorage.setItem("thread", thread); } catch {} }
  $("#who").textContent = "Google account: " + s.user_id;
  renderFiles((await api(`/api/files?thread_id=${thread}`)).files);
})();
</script>
</body>
